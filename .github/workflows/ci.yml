name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dados de exemplo
        run: python gerar_dados_exemplo.py

      - name: Smoke test — executa os apps de ponta a ponta (AppTest)
        run: python scripts/smoke_test.py

  check-syntax-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Verificar sintaxe do app.R
        run: |
          Rscript -e 'parse("app.R"); cat("OK - app.R sem erros de sintaxe\n")'
